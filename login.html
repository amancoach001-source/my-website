<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Study Assistant - Login</title>

  <link rel="stylesheet" href="login.css">
</head>

<body>

  <div class="particles" id="particles"></div>

  <div class="stage">
    <div class="card" id="card">

      <svg class="bot" viewBox="0 0 64 64" fill="none">
        <rect x="14" y="20" width="36" height="30" rx="8" fill="url(#g1)"/>
        <rect x="26" y="8" width="12" height="14" rx="4" fill="url(#g1)"/>
        <circle cx="32" cy="6" r="3" fill="#35e6c8"/>
        <circle cx="24" cy="34" r="4.5" fill="#0a0d1f"/>
        <circle cx="40" cy="34" r="4.5" fill="#0a0d1f"/>
        <rect x="24" y="43" width="16" height="3.5" rx="1.75"
              fill="#0a0d1f" opacity="0.6"/>
        <rect x="4" y="28" width="8" height="14" rx="4" fill="#7c5cfc"/>
        <rect x="52" y="28" width="8" height="14" rx="4" fill="#7c5cfc"/>

        <defs>
          <linearGradient id="g1" x1="14" y1="8" x2="50" y2="50"
                          gradientUnits="userSpaceOnUse">
            <stop stop-color="#35e6c8"/>
            <stop offset="1" stop-color="#7c5cfc"/>
          </linearGradient>
        </defs>
      </svg>

      <!-- LOGIN FORM -->
      <form id="loginForm">

        <h1>Welcome Back</h1>
        <p class="sub">AI Study Assistant में Login करें</p>

        <div class="field" id="loginEmailField">
          <label>Email</label>
          <input type="email"
                 id="loginEmail"
                 placeholder="अपना Email लिखें"
                 autocomplete="email">

          <div class="msg" id="loginEmailMsg"></div>
        </div>

        <div class="field" id="loginPassField">
          <label>Password</label>
          <input type="password"
                 id="loginPass"
                 placeholder="अपना Password लिखें"
                 autocomplete="current-password">

          <div class="msg" id="loginPassMsg"></div>
        </div>

        <button type="submit" class="btn" id="loginBtn">
          Login
        </button>

        <p class="switch">
          नया account बनाना है?
          <a id="toSignup">Sign Up</a>
        </p>

      </form>


      <!-- SIGNUP FORM -->
      <form id="signupForm" class="hidden">

        <h1>Create Account</h1>
        <p class="sub">नया account बनाएं और शुरू करें</p>

        <div class="field" id="signupNameField">
          <label>Name</label>

          <input type="text"
                 id="signupName"
                 placeholder="अपना नाम लिखें"
                 autocomplete="name">
        </div>

        <div class="field" id="signupEmailField">
          <label>Email</label>

          <input type="email"
                 id="signupEmail"
                 placeholder="अपना Email लिखें"
                 autocomplete="email">

          <div class="msg" id="signupEmailMsg"></div>
        </div>

        <div class="field" id="signupPassField">
          <label>Password</label>

          <input type="password"
                 id="signupPass"
                 placeholder="Password बनाएं (कम से कम 6 अक्षर)"
                 autocomplete="new-password">

          <div class="msg" id="signupPassMsg"></div>
        </div>

        <button type="submit" class="btn" id="signupBtn">
          Sign Up
        </button>

        <p class="switch">
          पहले से account है?
          <a id="toLogin">Login</a>
        </p>

      </form>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="login.js"></script>

</body>
</html>
