<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Study Assistant</title>

    <link rel="stylesheet" href="style.css">

    

</head>

<body>

    
<script type="module">
  import { auth } from "./firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const studyContainer = document.querySelector(".container");

  if (studyContainer) {
    studyContainer.style.visibility = "hidden";
  }

  onAuthStateChanged(auth, (user) => {
    if (user) {
      if (studyContainer) {
        studyContainer.style.visibility = "visible";
      }
    } else {
      window.location.replace("index.html");
    }
  });
</script>


    



    <div class="container">

        <h1>🤖 AI Study Assistant</h1>

        <p>Apna study doubt yahan likho</p>

        <input
            type="text"
            placeholder="Apna sawal likho..."
            id="question"
        >

        <button id="askBtn">Ask AI</button>
        <div id="answer"></div>
        <button id="logoutBtn" class="logout-btn" type="button">
    🚪 Logout
        </button>
        
    </div>
<script src="script.js"></script>

    <script type="module" src="logout.js"></script>
    
</body>
</html>
